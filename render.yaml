services:
  - type: web
    name: lvyuanjin-site
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: ALLOW_REGISTRATION
        value: "false"
    disk:
      name: site-data
      mountPath: /var/data
      sizeGB: 1
